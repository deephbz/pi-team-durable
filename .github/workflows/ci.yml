name: CI

# Every job runs in parallel; wall time is the slowest job. A tree that already
# passed is recorded by the `ci` gate and skipped on re-runs (merge push,
# release tag). Require only the `ci` check on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  # Types, build and the packed artifact. The prepare action restores
  # node_modules from cache without running `prepare`, so build explicitly.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - id: prepare
        uses: ./.github/actions/prepare
        with:
          node-version: ${{ matrix.node }}
      - if: steps.prepare.outputs.verified != 'true'
        run: |
          npm run build
          npm run typecheck & typecheck=$!
          npm run verify:package
          wait "$typecheck"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - id: prepare
        uses: ./.github/actions/prepare
        with:
          node-version: ${{ matrix.node }}
      - if: steps.prepare.outputs.verified != 'true'
        run: npx vitest run --exclude test/authority/incremental-graph-control.test.ts

  # The 2,000 seeded graph-controller sequences (about 80 s in one process), split in four.
  # Together with `test` they run every test file that `npm test` runs.
  sequences:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v4
      - id: prepare
        uses: ./.github/actions/prepare
        with:
          node-version: 24.x
      - if: steps.prepare.outputs.verified != 'true'
        env:
          PTB_SEQUENCE_SHARD: ${{ matrix.shard }}
        run: npx vitest run test/authority/incremental-graph-control.test.ts

  # Differential oracle against the frozen port: 100 seeds over 4 processes. Run 500 or more by hand before a release.
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - id: prepare
        uses: ./.github/actions/prepare
        with:
          node-version: ${{ matrix.node }}
      - if: steps.prepare.outputs.verified != 'true'
        run: npm run test:oracle -- --seeds 100 --shards 4

  ci:
    if: always()
    needs: [check, test, sequences, oracle]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - uses: actions/checkout@v4
      - id: record
        run: echo "name=$(.github/scripts/ci-verified.sh name)" >> "$GITHUB_OUTPUT"
      - run: echo "${{ github.sha }} ${{ github.run_id }}" > ci-verified.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.record.outputs.name }}
          path: ci-verified.txt
          retention-days: 90
          overwrite: true
